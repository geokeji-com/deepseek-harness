# Keep the shared runtime from exhausting the small single-host deployment.
# This drop-in overrides the service's larger default heap and makes the
# kernel evict only this service under memory pressure instead of the host.
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=1536
MemoryHigh=1792M
MemoryMax=2048M
MemorySwapMax=256M
TasksMax=256
CPUWeight=50
